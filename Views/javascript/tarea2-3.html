<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tercer ejercicio de JS sobre DOM">
    <meta property="og:title" content="Tercer ejercicio de JS sobre DOM">
    <meta property="og:description" content="Tercer ejercicio de JS sobre DOM">
    <link rel="icon" type="image/x-icon" href="../../media/JavaScript-logo.ico">
    <title>Ejercicio 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="card text-center col-4 offset-md-4 my-5 p-3" >
                <div id="pro-plan" class="card mb-4 shadow-sm">
                    <div class="card-header">
                        <h3 class="my-0 font-weight-normal">Pro</h3>
                    </div>
            
                    <div class="card-body">
                        <h4 class="card-title pricing-card-title">$<span class="pricing">30 / month</span></h4>
                        <ul id="proplanList" class="list-unstyled mt-3 mb-4">
                            <li>100 users included</li>
                            <li><span class="storage-amount">20</span> GB of storage</li>
                            <li>Priority email support</li>
                            <li>Help center access</li>
                        </ul>
                        <button type="button" class="btn btn-lg btn-block btn-outline-primary">Get Started</button>
                    </div>            
                </div>

                <div id="basic-plan" class="card mb-4 shadow-sm">
                    <div class="card-header">
                        <h3 class="my-0 font-weight-normal">Basic</h3>
                    </div>
                    <div class="card-body">
                        <h4 class="card-title pricing-card-title">$<span class="pricing">10 / month</span></h4>
                        <ul class="list-unstyled mt-3 mb-4">
                            <li>10 users included</li>
                            <li><span class="storage-amount">2</span> GB of storage</li>
                            <li>Email support</li>
                            <li>Help center access</li>
                        </ul>
                        <button type="button" class="btn btn-lg btn-block btn-outline-primary">Get Started</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="btn-group my-1" role="group" aria-label="Basic example">
                <button type="button" class="btn btn-danger border border-black" onclick="addListItem()">⊕ 27/7 Support</button>
                <button type="button" class="btn btn-danger border border-black" onclick="moveBasicPlan()">🔄 Basic - Pro 🔄 </button>
                <button type="button" class="btn btn-danger border border-black" onclick="updateProPlanButton()">✨ Buy Now</button>
                <button type="button" class="btn btn-danger border border-black" onclick="updateStorageOffers()">🆙 Storage</button>
                <button type="button" class="btn btn-danger border border-black" onclick="addPaymentToggle()">🔘 Monthly/Annual</button>
                <button type="button" class="btn btn-danger border border-black" onclick="resetDocument()">🧹 Clean all</button>
            </div>
        </div>
    </div>

</body>
<script src="reto3.js"></script>
</html>
